<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worth Your Time</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="intro" class="screen active">
    <h1>Hey.</h1>
  </div>

  <div id="main" class="screen">
    <h1>Let's have dinner.</h1>
    <p>I think it'll be worth your time.</p>

    <div class="buttons">
      <button id="yes">Sure.</button>
      <button id="no">Nah.</button>
    </div>

    <p id="tease" class="tease"></p>

    <div id="success" class="hidden">
      <h2>I knew you couldn't resist.</h2>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
